# DirtyDuck — violation-content features (the ontology promotion rule, applied).
#
# The canonical experiment.yaml features the inspection VERDICT (result/risk/type) and
# never its CONTENT: ontology.events.violations — what inspectors actually found — was
# a feature in zero configs (it appeared only in label queries). This config feeds the
# promoted, typed projections of that content to the model:
#
#   n_violations / n_critical / n_serious / n_minor  — severity counts per inspection
#   kw_rodent / kw_insect / kw_temperature / kw_handwashing — word-bounded keyword
#     flags over the inspector's free-text comment, computed in plain PostgreSQL
#
# Two facts from the DDL shape what is (and is not) here, so nobody re-derives them:
#   1. severity is a DETERMINISTIC function of code (1-14 critical / 15-29 serious /
#      else minor — 03_create_violations_table.sql), and description is that code's
#      canonical text (1:1). Free-text mining of `description` is therefore provably
#      redundant with counting codes by severity.
#   2. The only genuinely free text is `comment`. It gets a SHORT fixed keyword set in
#      SQL — not featurizer's NLP bridges (sentiment/readability/language-ID/NER),
#      which measure nothing on templated regulatory prose and would require a
#      Dagster/Snakemake pre-step that breaks the tutorial's two-command promise
#      (see docs/featurizer-passthrough-features.md, "Why not on DirtyDuck").
#
# IDENTITY: the problem block below (cohort/label/temporal/problem_type) is byte-
# identical to experiment.yaml — deliberately. Features vary per RUN, not per
# Experiment (ADR-0022), so this config attaches new runs to the SAME experiment
# (b9e38fd8…) and `triage leaderboard b9e38fd8` compares verdict-only, violation-only,
# and combined feature sets directly. The canonical config and its published numbers
# are untouched.
#
# CACHE / version_label — correctness, not bookkeeping: a source fingerprint is
# (row_count, max_knowledge_date), and adding columns changes NEITHER — the derivation
# DAG would happily serve a matrix built before the columns existed. The events source
# below is pinned dirtyduck-v2 to force a rebuild that sees the new columns. The
# entities relation gained no columns, so it stays v1 and its cohort artifacts remain
# shared with the canonical runs.

problem_type: classification

task_framing: resource_prioritization

temporal_config:
  feature_start_time: '2014-01-01'
  feature_end_time: '2017-07-01'
  label_start_time: '2015-01-01'
  label_end_time: '2017-07-01'
  model_update_frequency: '6month'
  training_as_of_date_frequencies: '6month'
  training_label_timespans: ['6month']
  test_as_of_date_frequencies: '6month'
  test_durations: '0day'
  test_label_timespans: ['6month']
  max_training_histories: '5year'

cohort_config:
  name: active_facilities
  query: |
    select e.entity_id
    from ontology.entities as e
    where e.activity_period @> {as_of_date}::date

label_config:
  name: failed_inspections
  query: |
    select
      entity_id,
      bool_or(result = 'fail')::integer as outcome
    from ontology.events
    where {as_of_date}::date <= date
      and date < {as_of_date}::date + {label_timespan}
    group by entity_id

feature_config:
  target: facilities
  max_depth: 2
  intervals:
    - P1M
    - P3M
    - P6M

  # Restrict the DFS primitives, deliberately: unrestricted, 8 numeric variables at
  # depth 2 explode into ~2,500 columns of transform compositions
  # (ABS(facilities.MEAN(…)), CUM_SUM(…), nested ABS — some past PostgreSQL's 63-char
  # name limit). This keeps every feature something a reader can say aloud: counts of
  # verdicts, sums/means/maxes of violation content. The empty list means "no
  # transform layer" — honored since featurizer v1.0.1 (before that it silently fell
  # back to the 17 defaults; 'transformations: [identity]' is the byte-identical
  # spelling that also works on older engines).
  aggregations: [count, nunique, sum, mean, max]
  transformations: []

  entities:
    - alias: facilities
      id: entity_id
      table: ontology.entities
      variables:
        facility:
          type: text
          role: identifier
        facility_type:
          type: categorical
          role: categorical
          vocabulary:
            - "restaurant"
            - "grocery store"
            - "school"
            - "unknown"
            - "children's services facility"
            - "bakery"
            - "daycare (2 - 6 years)"
            - "daycare above and under 2 years"
            - "liquor"
            - "long term care"
            - "catering"
            - "mobile food preparer"
            - "mobile food dispenser"
            - "daycare combo 1586"
            - "hospital"

    - alias: inspections
      id: ~
      table: ontology.events
      temporal_ix: date
      variables:
        # The verdict (canonical experiment.yaml's feature set):
        result:
          type: categorical
        risk:
          type: categorical
        # The content — typed promotions of the violations jsonb. "How many critical
        # violations has this facility accumulated in the last 3 months" is exactly
        # the feature a health department reaches for first; SUM/AVG/MAX over the
        # P1M/P3M/P6M intervals give it to the model.
        n_violations:
          type: numeric
        n_critical:
          type: numeric
        n_serious:
          type: numeric
        n_minor:
          type: numeric
        # "Did a prior inspection mention rodents" — a feature any reader understands.
        kw_rodent:
          type: numeric
        kw_insect:
          type: numeric
        kw_temperature:
          type: numeric
        kw_handwashing:
          type: numeric

  relationships:
    - parent:
        entity: facilities
        key: entity_id
      child:
        entity: inspections
        key: entity_id
      temporal:
        mode: as_of

  # The question this config exists to answer, made legible (ADR-0023): one Experiment,
  # four Runs — all features, and leave-one-out of each named group — whose leaderboards
  # compare directly. "Do violation-content features add lift over facility attributes
  # and inspection verdicts?" is read straight off `triage leaderboard`.
  feature_groups:
    # Globs match the full DFS column name (fnmatch; every column must land in exactly
    # one group). "*(inspections.date*" is the pure activity volume (COUNT/NUNIQUE over
    # the event index) — history, not content.
    definitions:
      facility_attrs: ["facilities.*"]
      inspection_history: ["*(inspections.date*", "*(inspections.result*", "*(inspections.risk*"]
      violation_content: ["*(inspections.n_*", "*(inspections.kw_*"]
    strategies: [all, leave-one-out]

# No heuristic rankers/thresholders here: they select a matrix column BY NAME
# ('COUNT(inspections.result)'), which vanishes in the leave-one-out runs that drop
# the verdict group. Dummy keeps the floor.
grid_config:
  'sklearn.tree.DecisionTreeClassifier':
    max_depth: [5]
    min_samples_split: [50]
  'triage.component.catwalk.estimators.classifiers.ScaledLogisticRegression':
    C: [1.0]
    penalty: ['l2']
    max_iter: [1000]
  'sklearn.dummy.DummyClassifier':
    strategy: ['prior']

sources:
  - name: ontology_entities
    relation: ontology.entities
    knowledge_date_column: start_time
    version_label: 'dirtyduck-v1'   # unchanged relation — cohort artifacts stay shared
    role: entity
    type_column: facility_type
    description: Active food-service facilities (DirtyDuck tutorial)

  - name: ontology_events
    relation: ontology.events
    knowledge_date_column: date
    # v2 = the violation-content columns. The fingerprint (row_count,
    # max_knowledge_date) is blind to added columns; without this bump the DAG would
    # serve a pre-column matrix from cache. See the header note.
    version_label: 'dirtyduck-v2'
    role: event
    type_column: type
    description: Food inspection events with result, violations, and typed violation-content projections (DirtyDuck tutorial)

imputation_config:
  count:
    type: zero_noflag
  all:
    type: zero
