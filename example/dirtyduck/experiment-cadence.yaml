# DirtyDuck — evaluation-cadence demonstration (reference/evaluation.md).
#
# The canonical experiment.yaml uses test_durations '0day': one test as_of_date per
# split, so each model gets exactly ONE evaluation point per metric. That is a
# deliberate teaching default, not what a deployed program looks like. This config
# runs the SAME problem against the SAME baked data with a real test cadence:
#
#   test_durations '6month' × test_as_of_date_frequencies '1month'
#     → 6 test as_of_dates per split (the window is half-open: months 0..5)
#     → triage.evaluations holds one row-set per date (the storage grain)
#     → triage.evaluations_windowed rolls them up: n_as_of_dates = 6, with
#       value_mean / value_stddev / value_min — read it with
#       `triage leaderboard <hash> --windowed`.
#
# DSSG triage could not do this: a multi-date test window collapsed into a single
# pooled ranking at its max date. Here per-date rows are the primary storage
# (migration 0010 - see docs-site reference/evaluation.md for why the pooled metric
# answered a question no operator asks).
#
# NOTE: this file deliberately does NOT touch experiment.yaml. temporal_config is part
# of Experiment identity (ADR-0022), so editing the canonical file would change the
# hash the nightly tutorial-smoke asserts (b9e38fd8…) and invalidate every published
# tutorial number. A new file gets its own experiment hash and endangers neither.

problem_type: classification

task_framing: resource_prioritization

temporal_config:
  feature_start_time: '2014-01-01'
  feature_end_time: '2017-07-01'
  label_start_time: '2015-01-01'
  label_end_time: '2017-07-01'
  # Yearly retrain (fewer splits than the canonical 6month — this config's point is
  # the per-split test cadence, not the split count): 2 splits.
  model_update_frequency: '1year'
  training_as_of_date_frequencies: '6month'
  training_label_timespans: ['6month']
  # THE POINT: a 6-month test window scored monthly. Label maturity is guaranteed by
  # construction — timechop walks the last test date back from label_end_time by the
  # test label_timespan and then by test_durations, so every test as_of_date t
  # satisfies t + label_timespan <= label_end_time.
  test_as_of_date_frequencies: '1month'
  test_durations: '6month'
  test_label_timespans: ['6month']
  max_training_histories: '5year'

cohort_config:
  name: active_facilities
  query: |
    select e.entity_id
    from ontology.entities as e
    where e.activity_period @> {as_of_date}::date

label_config:
  name: failed_inspections
  query: |
    select
      entity_id,
      bool_or(result = 'fail')::integer as outcome
    from ontology.events
    where {as_of_date}::date <= date
      and date < {as_of_date}::date + {label_timespan}
    group by entity_id

# Same featurizer ER-graph as experiment.yaml (features are Run-level, not part of
# experiment identity), trimmed to nothing — see that file for the commentary.
feature_config:
  target: facilities
  max_depth: 2
  intervals:
    - P1M
    - P3M
    - P6M

  entities:
    - alias: facilities
      id: entity_id
      table: ontology.entities
      variables:
        facility:
          type: text
          role: identifier
        facility_type:
          type: categorical
          role: categorical
          vocabulary:
            - "restaurant"
            - "grocery store"
            - "school"
            - "unknown"
            - "children's services facility"
            - "bakery"
            - "daycare (2 - 6 years)"
            - "daycare above and under 2 years"
            - "liquor"
            - "long term care"
            - "catering"
            - "mobile food preparer"
            - "mobile food dispenser"
            - "daycare combo 1586"
            - "hospital"

    - alias: inspections
      id: ~
      table: ontology.events
      temporal_ix: date
      variables:
        result:
          type: categorical
        risk:
          type: categorical

  relationships:
    - parent:
        entity: facilities
        key: entity_id
      child:
        entity: inspections
        key: entity_id
      temporal:
        mode: as_of

# Small grid: one real model, one interpretable linear, one floor. The cadence story
# reads the same from 3 models as from 8, and this config exists to be run.
grid_config:
  'sklearn.tree.DecisionTreeClassifier':
    max_depth: [5]
    min_samples_split: [50]
  'triage.component.catwalk.estimators.classifiers.ScaledLogisticRegression':
    C: [1.0]
    penalty: ['l2']
    max_iter: [1000]
  'sklearn.dummy.DummyClassifier':
    strategy: ['prior']

sources:
  - name: ontology_entities
    relation: ontology.entities
    knowledge_date_column: start_time
    version_label: 'dirtyduck-v1'
    role: entity
    type_column: facility_type
    description: Active food-service facilities (DirtyDuck tutorial)

  - name: ontology_events
    relation: ontology.events
    knowledge_date_column: date
    version_label: 'dirtyduck-v1'
    role: event
    type_column: type
    description: Food inspection events with result and violations (DirtyDuck tutorial)

imputation_config:
  count:
    type: zero_noflag
  all:
    type: zero
