# CD on tag (v1-release plan P10): every v* tag reproducibly yields the runnable
# container on GHCR and a GitHub Release carrying the onboarding + comparison artifacts.
# No PyPI (deliberately retired), no environment deploys (the cloud gate, ADR-0004/0005,
# stays closed — a future deploy.yml can hang off this same trigger once it opens).

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # Fail fast if the tag and pyproject.toml disagree — otherwise a mistyped tag
      # publishes a GHCR image and a Release whose `triage --version` contradicts the
      # version people installed by. Prerelease suffixes are stripped before comparing:
      # v1.0.0-rc1 is cut to 1.0.0, matching how the rc tags were actually cut.
      - name: Guard - tag matches pyproject version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          tag_base="${tag_version%%-*}"
          proj_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag_base" != "$proj_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} implies version ${tag_base}, but pyproject.toml declares ${proj_version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches pyproject.toml version ${proj_version}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
      - name: Build + push
        run: |
          mapfile -t tags <<< "${{ steps.meta.outputs.tags }}"
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          docker build "${args[@]}" .
          docker push --all-tags ghcr.io/${{ github.repository }}
      - name: GitHub Release (prerelease for -rc tags)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            docs/onboarding.html
            docs/triage-pg-vs-dssg-triage.html

  # GHCR packages default to PRIVATE even when the repo is public — visibility is a
  # separate, manual flip. Nothing in the build catches a regression there, so the
  # failure would surface as a stranger's first `docker pull` failing, reported by a
  # user rather than by CI. This job is the smoke test: a runner with no registry
  # credentials pulls the tag just published and runs the CLI out of it.
  verify-anonymous-pull:
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 15
    steps:
      # Deliberately NO docker/login-action here. A fresh runner holds no GHCR
      # credentials; the explicit logout guards against an inherited config.json.
      - name: Drop any registry credentials
        run: docker logout ghcr.io || true
      - name: Pull the published image anonymously
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          # GHCR can lag a few seconds behind the push before a tag resolves.
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              echo "pulled ${image} with no credentials"
              exit 0
            fi
            echo "attempt ${attempt} failed; retrying in 15s"
            sleep 15
          done
          echo "::error::${image} is not anonymously pullable — the GHCR package is most" \
               "likely PRIVATE. Flip it to public under the repo's Packages settings."
          exit 1
      - name: The image actually runs, and reports this version
        run: |
          image="ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
          reported="$(docker run --rm "$image" triage --version)"
          echo "container reports: ${reported}"
          expected="${GITHUB_REF_NAME#v}"
          expected="${expected%%-*}"
          case "$reported" in
            *"$expected"*) echo "matches the tagged version ${expected}" ;;
            *) echo "::error::image reports '${reported}', expected version ${expected}"
               exit 1 ;;
          esac
